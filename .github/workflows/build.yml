
name: Build F.R.I.D.A.Y. for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build F.R.I.D.A.Y.
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name FRIDAY --collect-all customtkinter --collect-all groq --collect-all pyttsx3 --hidden-import=pyaudio --hidden-import=pyttsx3.drivers.sapi5 --hidden-import=pythoncom --hidden-import=win32com.client main.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Windows
          path: dist/FRIDAY.exe
          if-no-files-found: error
          retention-days: 14
